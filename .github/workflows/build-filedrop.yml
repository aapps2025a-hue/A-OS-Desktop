name: Build FileDrop desktop apps

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "filedrop/**"
      - ".github/workflows/build-filedrop.yml"

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            artifact: A-OS-FileDrop-Windows
            icon: filedrop/assets/filedrop.ico
          - os: macos-latest
            artifact: A-OS-FileDrop-macOS
            icon: filedrop/assets/filedrop.icns
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Use Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Test FileDrop protocol
        run: python -m unittest filedrop.tests.test_filedrop -v

      - name: Install packager
        run: python -m pip install -r filedrop/requirements-build.txt

      - name: Build native desktop app
        run: pyinstaller --noconfirm --clean --onefile --windowed --name A-OS-FileDrop --icon "${{ matrix.icon }}" --paths filedrop filedrop/desktop_app.py

      - name: Sign and verify macOS app
        if: runner.os == 'macOS'
        shell: bash
        run: |
          codesign --force --deep --sign - --timestamp=none "dist/A-OS-FileDrop.app"
          codesign --verify --deep --strict --verbose=2 "dist/A-OS-FileDrop.app"

      - name: Package Windows app
        if: runner.os == 'Windows'
        shell: pwsh
        run: Compress-Archive -Path "dist/A-OS-FileDrop.exe" -DestinationPath "A-OS-FileDrop-Windows.zip"

      - name: Package macOS app
        if: runner.os == 'macOS'
        run: ditto -c -k --sequesterRsrc --keepParent "dist/A-OS-FileDrop.app" "A-OS-FileDrop-macOS.zip"

      - name: Create macOS disk image
        if: runner.os == 'macOS'
        shell: bash
        run: |
          rm -rf dmg-root
          mkdir dmg-root
          cp -R "dist/A-OS-FileDrop.app" dmg-root/
          ln -s /Applications dmg-root/Applications
          cat > dmg-root/READ-ME-FIRST.txt <<'EOF'
          A-OS FileDrop for macOS

          1. Drag A-OS-FileDrop.app to Applications.
          2. Try to open it once.
          3. If macOS says Apple cannot check the app, open System Settings,
             select Privacy & Security, scroll to Security, and click Open Anyway.
          4. Confirm Open. macOS remembers this choice for future launches.

          The app is reproducibly built and ad-hoc signed by GitHub Actions.
          Apple only removes this warning for apps signed and notarized with a
          paid Apple Developer ID. You can verify the downloaded DMG against the
          SHA-256 checksum attached to the same GitHub release.
          EOF
          hdiutil create \
            -volname "A-OS FileDrop" \
            -srcfolder dmg-root \
            -ov \
            -format UDZO \
            "A-OS-FileDrop-macOS.dmg"
          shasum -a 256 "A-OS-FileDrop-macOS.dmg" > "A-OS-FileDrop-macOS.dmg.sha256"

      - name: Create Windows checksums
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          Copy-Item "dist/A-OS-FileDrop.exe" "A-OS-FileDrop.exe"
          (Get-FileHash "dist/A-OS-FileDrop.exe" -Algorithm SHA256).Hash.ToLower() + "  A-OS-FileDrop.exe" | Set-Content "A-OS-FileDrop.exe.sha256"
          (Get-FileHash "A-OS-FileDrop-Windows.zip" -Algorithm SHA256).Hash.ToLower() + "  A-OS-FileDrop-Windows.zip" | Set-Content "A-OS-FileDrop-Windows.zip.sha256"

      - name: Upload desktop app
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: |
            A-OS-FileDrop-*.zip
            A-OS-FileDrop-*.dmg
            A-OS-FileDrop-*.sha256
            A-OS-FileDrop.exe
            A-OS-FileDrop.exe.sha256
          retention-days: 30
          if-no-files-found: error

  release:
    name: Publish FileDrop release
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Download desktop packages
        uses: actions/download-artifact@v4
        with:
          path: release-assets
          merge-multiple: true

      - name: Publish GitHub release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: filedrop-v1.0.1
          name: A-OS FileDrop 1.0.1
          make_latest: true
          body: |
            FileDrop transfers files directly between A-OS, Windows, and macOS devices on the same local network.

            The macOS download is `A-OS-FileDrop-macOS.dmg`. Its app bundle is ad-hoc signed and signature-verified during the GitHub build.

            Apple only suppresses the unidentified-developer warning for Developer ID-signed and notarized apps. Until A-OS has an Apple Developer ID, install the app, try to open it once, then open **System Settings > Privacy & Security** and select **Open Anyway**. This is a one-time choice for that build. Installation instructions are also included inside the DMG.
          files: |
            release-assets/A-OS-FileDrop-Windows.zip
            release-assets/A-OS-FileDrop-Windows.zip.sha256
            release-assets/A-OS-FileDrop.exe
            release-assets/A-OS-FileDrop.exe.sha256
            release-assets/A-OS-FileDrop-macOS.zip
            release-assets/A-OS-FileDrop-macOS.dmg
            release-assets/A-OS-FileDrop-macOS.dmg.sha256
