name: Build FileDrop desktop apps

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "filedrop/**"
      - ".github/workflows/build-filedrop.yml"

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            artifact: A-OS-FileDrop-Windows
            icon: filedrop/assets/filedrop.ico
          - os: macos-latest
            artifact: A-OS-FileDrop-macOS
            icon: filedrop/assets/filedrop.icns
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Use Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Test FileDrop protocol
        run: python -m unittest filedrop.tests.test_filedrop -v

      - name: Install packager
        run: python -m pip install -r filedrop/requirements-build.txt

      - name: Build native desktop app
        run: pyinstaller --noconfirm --clean --onefile --windowed --name A-OS-FileDrop --icon "${{ matrix.icon }}" --paths filedrop filedrop/desktop_app.py

      - name: Package Windows app
        if: runner.os == 'Windows'
        shell: pwsh
        run: Compress-Archive -Path "dist/A-OS-FileDrop.exe" -DestinationPath "A-OS-FileDrop-Windows.zip"

      - name: Package macOS app
        if: runner.os == 'macOS'
        run: ditto -c -k --sequesterRsrc --keepParent "dist/A-OS-FileDrop.app" "A-OS-FileDrop-macOS.zip"

      - name: Create macOS disk image
        if: runner.os == 'macOS'
        shell: bash
        run: |
          rm -rf dmg-root
          mkdir dmg-root
          cp -R "dist/A-OS-FileDrop.app" dmg-root/
          ln -s /Applications dmg-root/Applications
          hdiutil create \
            -volname "A-OS FileDrop" \
            -srcfolder dmg-root \
            -ov \
            -format UDZO \
            "A-OS-FileDrop-macOS.dmg"
          shasum -a 256 "A-OS-FileDrop-macOS.dmg" > "A-OS-FileDrop-macOS.dmg.sha256"

      - name: Create Windows checksums
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          Copy-Item "dist/A-OS-FileDrop.exe" "A-OS-FileDrop.exe"
          (Get-FileHash "dist/A-OS-FileDrop.exe" -Algorithm SHA256).Hash.ToLower() + "  A-OS-FileDrop.exe" | Set-Content "A-OS-FileDrop.exe.sha256"
          (Get-FileHash "A-OS-FileDrop-Windows.zip" -Algorithm SHA256).Hash.ToLower() + "  A-OS-FileDrop-Windows.zip" | Set-Content "A-OS-FileDrop-Windows.zip.sha256"

      - name: Upload desktop app
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: |
            A-OS-FileDrop-*.zip
            A-OS-FileDrop-*.dmg
            A-OS-FileDrop-*.sha256
            A-OS-FileDrop.exe
            A-OS-FileDrop.exe.sha256
          retention-days: 30
          if-no-files-found: error

  release:
    name: Publish FileDrop release
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Download desktop packages
        uses: actions/download-artifact@v4
        with:
          path: release-assets
          merge-multiple: true

      - name: Publish GitHub release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: filedrop-v1.0.0
          name: A-OS FileDrop 1.0
          make_latest: false
          body: |
            FileDrop transfers files directly between A-OS, Windows, and macOS devices on the same local network.

            The macOS download is the `.dmg` file. The app is currently unsigned, so macOS may ask you to right-click the app and choose Open the first time.
          files: |
            release-assets/A-OS-FileDrop-Windows.zip
            release-assets/A-OS-FileDrop-Windows.zip.sha256
            release-assets/A-OS-FileDrop.exe
            release-assets/A-OS-FileDrop.exe.sha256
            release-assets/A-OS-FileDrop-macOS.zip
            release-assets/A-OS-FileDrop-macOS.dmg
            release-assets/A-OS-FileDrop-macOS.dmg.sha256
