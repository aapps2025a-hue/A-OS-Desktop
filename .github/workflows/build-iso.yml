name: Build A-OS Desktop ISO

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "iso/**"
      - "public/**"
      - ".github/workflows/build-iso.yml"

permissions:
  contents: write

concurrency:
  group: aos-desktop-iso
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Install Debian Live tools
        run: |
          sudo apt-get update
          sudo apt-get install -y ca-certificates cpio debootstrap dosfstools grub-efi-amd64-bin grub-pc-bin isolinux mtools rsync squashfs-tools syslinux-common wget xorriso xz-utils
          wget -qO /tmp/live-build.deb https://deb.debian.org/debian/pool/main/l/live-build/live-build_20250505+deb13u1_all.deb
          echo "58e09779881cbcc631c49ceb703413e0247a87db01823e597b2a1c40a2afd8f4  /tmp/live-build.deb" | sha256sum -c -
          sudo dpkg -i /tmp/live-build.deb

      - name: Add the current A-OS web build
        run: |
          rm -rf iso/config/includes.chroot/opt/a-os/public
          mkdir -p iso/config/includes.chroot/opt/a-os/public
          cp -a public/. iso/config/includes.chroot/opt/a-os/public/

      - name: Build bootable ISO hybrid
        working-directory: iso
        run: |
          sudo lb clean --purge || true
          sudo lb config
          sudo lb build
          sudo mv live-image-amd64.hybrid.iso ../A-OS-Desktop-amd64.iso
          sudo chown "$USER:$USER" ../A-OS-Desktop-amd64.iso

      - name: Create checksum
        run: sha256sum A-OS-Desktop-amd64.iso > A-OS-Desktop-amd64.iso.sha256

      - name: Upload workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: A-OS-Desktop-bootable-ISO
          path: |
            A-OS-Desktop-amd64.iso
            A-OS-Desktop-amd64.iso.sha256
          retention-days: 30

      - name: Publish ISO release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if ! gh release view iso-v1.2.1-managed11 >/dev/null 2>&1; then
            gh release create iso-v1.2.1-managed11 \
              --title "A-OS Desktop bootable ISO" \
              --notes "Bootable Debian Live image containing the same A-OS Desktop build and boot animation as the hosted website."
          fi
          gh release upload iso-v1.2.1-managed11 \
            A-OS-Desktop-amd64.iso \
            A-OS-Desktop-amd64.iso.sha256 \
            --clobber
