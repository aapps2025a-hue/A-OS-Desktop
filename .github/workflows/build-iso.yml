name: Build A-OS Desktop ISO

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "iso/**"
      - "public/**"
      - "scripts/smoke-apps.mjs"
      - ".github/workflows/build-iso.yml"

permissions:
  contents: write

concurrency:
  group: aos-desktop-iso
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Use Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Install Debian Live tools
        run: |
          sudo apt-get update
          sudo apt-get install -y ca-certificates cpio debootstrap debian-archive-keyring dosfstools e2fsprogs fdisk grub-efi-amd64-bin grub-pc-bin isolinux mtools ntfs-3g ovmf parted qemu-system-x86 rsync squashfs-tools syslinux-common wget xorriso xz-utils
          wget -qO /tmp/live-build.deb https://deb.debian.org/debian/pool/main/l/live-build/live-build_20250505+deb13u1_all.deb
          echo "58e09779881cbcc631c49ceb703413e0247a87db01823e597b2a1c40a2afd8f4  /tmp/live-build.deb" | sha256sum -c -
          sudo dpkg -i /tmp/live-build.deb

      - name: Test installer safety logic
        run: python3 -m unittest discover -s iso/tests -v

      - name: Test real NTFS resizing on a disposable disk
        run: sudo python3 iso/tests/integration_partition.py

      - name: Add the current A-OS web build
        run: |
          node scripts/stamp-version.mjs
          rm -rf iso/config/includes.chroot/opt/a-os/public
          mkdir -p iso/config/includes.chroot/opt/a-os/public
          cp -a public/. iso/config/includes.chroot/opt/a-os/public/

      - name: Launch the packaged A-OS apps in Chrome
        run: |
          set -euo pipefail
          python3 -m http.server 8765 --directory public >/tmp/aos-app-server.log 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid" 2>/dev/null || true' EXIT
          chrome_bin=$(command -v google-chrome || command -v chromium || command -v chromium-browser)
          AOS_CHROME_BIN="$chrome_bin" AOS_SMOKE_URL="http://127.0.0.1:8765/a-os.html?aosLiveIso=1" node scripts/smoke-apps.mjs

      - name: Build bootable ISO hybrid
        working-directory: iso
        run: |
          sudo lb clean --purge || true
          sudo lb config
          sudo lb build
          sudo mv live-image-amd64.hybrid.iso ../A-OS-Desktop-amd64.iso
          sudo chown "$USER:$USER" ../A-OS-Desktop-amd64.iso

      - name: Boot-test packaged A-OS in QEMU
        run: |
          rm -f /tmp/aos-serial.log
          qemu-system-x86_64 \
            -machine accel=tcg \
            -m 3072 \
            -smp 2 \
            -cdrom A-OS-Desktop-amd64.iso \
            -boot d \
            -display none \
            -serial file:/tmp/aos-serial.log \
            -no-reboot &
          qemu_pid=$!
          trap 'kill "$qemu_pid" 2>/dev/null || true' EXIT
          browser_ready=false
          network_ready=false
          for attempt in $(seq 1 300); do
            grep -q "AOS_BROWSER_HTML_READY" /tmp/aos-serial.log 2>/dev/null && browser_ready=true
            grep -q "AOS_NETWORK_ONLINE" /tmp/aos-serial.log 2>/dev/null && network_ready=true
            if grep -q "AOS_NETWORK_OFFLINE" /tmp/aos-serial.log 2>/dev/null; then
              cat /tmp/aos-serial.log
              echo "A-OS booted, but the ISO could not reach the Internet." >&2
              exit 1
            fi
            if [ "$browser_ready" = true ] && [ "$network_ready" = true ]; then
              echo "Chromium executed A-OS HTML and the ISO reached the Internet after boot."
              exit 0
            fi
            if ! kill -0 "$qemu_pid" 2>/dev/null; then
              cat /tmp/aos-serial.log
              exit 1
            fi
            sleep 2
          done
          cat /tmp/aos-serial.log
          echo "Chromium did not load the packaged A-OS HTML within ten minutes." >&2
          exit 1

      - name: Boot-test the installed full-disk layout in UEFI
        run: |
          set -euo pipefail
          disk=/tmp/aos-installed.raw
          iso_mount=/mnt/aos-test-iso
          system_mount=/mnt/aos-test-system
          data_mount=/mnt/aos-test-data
          efi_mount=/mnt/aos-test-efi
          loop_device=""
          qemu_pid=""
          cleanup() {
            if [ -n "$qemu_pid" ]; then kill "$qemu_pid" 2>/dev/null || true; fi
            sudo umount "$efi_mount" "$data_mount" "$system_mount" "$iso_mount" 2>/dev/null || true
            if [ -n "$loop_device" ]; then sudo losetup -d "$loop_device" 2>/dev/null || true; fi
          }
          trap cleanup EXIT
          truncate -s 16G "$disk"
          parted -s "$disk" mklabel gpt
          parted -s "$disk" unit MiB mkpart EFI fat32 1 513
          parted -s "$disk" set 1 esp on
          parted -s "$disk" unit MiB mkpart AOS_SYSTEM ext4 513 6657
          parted -s "$disk" unit MiB mkpart AOS_DATA ext4 6657 100%
          loop_device=$(sudo losetup --find --show --partscan "$disk")
          sudo mkfs.vfat -F 32 -n AOS_EFI "${loop_device}p1"
          sudo mkfs.ext4 -F -L AOS_SYSTEM "${loop_device}p2"
          sudo mkfs.ext4 -F -L persistence "${loop_device}p3"
          sudo mkdir -p "$iso_mount" "$system_mount" "$data_mount" "$efi_mount"
          sudo mount -o loop,ro A-OS-Desktop-amd64.iso "$iso_mount"
          sudo mount "${loop_device}p2" "$system_mount"
          sudo mount "${loop_device}p3" "$data_mount"
          sudo mount "${loop_device}p1" "$efi_mount"
          sudo rsync -aH --delete "$iso_mount/" "$system_mount/"
          echo '/ union' | sudo tee "$data_mount/persistence.conf" >/dev/null
          system_uuid=$(sudo blkid -s UUID -o value "${loop_device}p2")
          python3 - "$system_uuid" "$PWD" > /tmp/aos-installed-grub.cfg <<'PY'
          import importlib.util
          import os
          from pathlib import Path
          import sys

          repository = Path(sys.argv[2])
          os.environ["AOS_PUBLIC_ROOT"] = str(repository / "public")
          server_path = repository / "iso/config/includes.chroot/usr/local/lib/aos/server.py"
          spec = importlib.util.spec_from_file_location("aos_server", server_path)
          server = importlib.util.module_from_spec(spec)
          spec.loader.exec_module(server)
          print(server.standalone_grub_configuration(sys.argv[1]), end="")
          PY
          sudo mkdir -p "$efi_mount/EFI/BOOT" "$efi_mount/EFI/AOSDesktop"
          sudo cp iso/config/includes.chroot/usr/share/plymouth/themes/aos/aos-boot.png "$efi_mount/EFI/AOSDesktop/splash.png"
          sudo grub-mkstandalone \
            --format=x86_64-efi \
            --output="$efi_mount/EFI/AOSDesktop/grubx64.efi" \
            --locales= \
            --fonts=unicode \
            --modules="part_gpt fat ext2 iso9660 loopback linux normal search search_fs_uuid gfxterm png efi_gop" \
            "boot/grub/grub.cfg=/tmp/aos-installed-grub.cfg"
          sudo cp "$efi_mount/EFI/AOSDesktop/grubx64.efi" "$efi_mount/EFI/BOOT/BOOTX64.EFI"
          printf 'fs0:\\EFI\\AOSDesktop\\grubx64.efi\r\n' | sudo tee "$efi_mount/startup.nsh" >/dev/null
          sudo sync
          sudo umount "$efi_mount" "$data_mount" "$system_mount" "$iso_mount"
          sudo losetup -d "$loop_device"
          loop_device=""
          rm -f /tmp/aos-installed-serial.log
          if [ -f /usr/share/OVMF/OVMF_CODE_4M.fd ]; then
            ovmf_code=/usr/share/OVMF/OVMF_CODE_4M.fd
            ovmf_vars_template=/usr/share/OVMF/OVMF_VARS_4M.fd
          else
            ovmf_code=/usr/share/OVMF/OVMF_CODE.fd
            ovmf_vars_template=/usr/share/OVMF/OVMF_VARS.fd
          fi
          test -f "$ovmf_code"
          test -f "$ovmf_vars_template"
          cp "$ovmf_vars_template" /tmp/aos-ovmf-vars.fd
          qemu-system-x86_64 \
            -machine accel=tcg \
            -m 3072 \
            -smp 2 \
            -drive if=pflash,format=raw,readonly=on,file="$ovmf_code" \
            -drive if=pflash,format=raw,file=/tmp/aos-ovmf-vars.fd \
            -drive file="$disk",format=raw,if=virtio \
            -boot c \
            -display none \
            -serial file:/tmp/aos-installed-serial.log \
            -no-reboot &
          qemu_pid=$!
          browser_ready=false
          network_ready=false
          for attempt in $(seq 1 300); do
            grep -q "AOS_BROWSER_HTML_READY" /tmp/aos-installed-serial.log 2>/dev/null && browser_ready=true
            grep -q "AOS_NETWORK_ONLINE" /tmp/aos-installed-serial.log 2>/dev/null && network_ready=true
            if grep -q "AOS_NETWORK_OFFLINE" /tmp/aos-installed-serial.log 2>/dev/null; then
              cat /tmp/aos-installed-serial.log
              echo "Installed A-OS booted, but it could not reach the Internet." >&2
              exit 1
            fi
            if [ "$browser_ready" = true ] && [ "$network_ready" = true ]; then
              echo "The installed UEFI layout executed A-OS HTML and reached the Internet."
              exit 0
            fi
            if ! kill -0 "$qemu_pid" 2>/dev/null; then
              cat /tmp/aos-installed-serial.log
              exit 1
            fi
            sleep 2
          done
          cat /tmp/aos-installed-serial.log
          echo "The installed UEFI layout did not reach A-OS within ten minutes." >&2
          exit 1

      - name: Create checksum
        run: sha256sum A-OS-Desktop-amd64.iso > A-OS-Desktop-amd64.iso.sha256

      - name: Package repair for existing A-OS installations
        run: |
          sh iso/build-network-repair.sh
          dpkg-deb --info A-OS-Network-Repair-20261021.deb
          sha256sum A-OS-Network-Repair-20261021.deb > A-OS-Network-Repair-20261021.deb.sha256
          cp iso/repair/README.txt A-OS-Network-Repair-README.txt

      - name: Upload workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: A-OS-Desktop-bootable-ISO
          path: |
            A-OS-Desktop-amd64.iso
            A-OS-Desktop-amd64.iso.sha256
            A-OS-Network-Repair-20261021.deb
            A-OS-Network-Repair-20261021.deb.sha256
            A-OS-Network-Repair-README.txt
          retention-days: 30

      - name: Publish ISO release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if ! gh release view iso-v3.0.0 >/dev/null 2>&1; then
            gh release create iso-v3.0.0 \
              --title "A-OS Desktop 3.0 bootable installer"
          fi
          gh release edit iso-v3.0.0 \
            --title "A-OS Desktop 3.0 bootable installer" \
            --notes "A-OS Desktop 3.0 boots the packaged A-OS HTML, supports a full-disk UEFI installation with a universal fallback loader, keeps persistent files and settings, and includes NetworkManager Wi-Fi with automatic repair for incomplete WPA profiles, improved BlueZ Bluetooth, Family Device, Python execution, and the A-OS command line. Publication requires both the USB image and a no-USB installed UEFI disk to boot in QEMU until A-OS HTML executes."
          gh release upload iso-v3.0.0 \
            A-OS-Desktop-amd64.iso \
            A-OS-Desktop-amd64.iso.sha256 \
            A-OS-Network-Repair-20261021.deb \
            A-OS-Network-Repair-20261021.deb.sha256 \
            A-OS-Network-Repair-README.txt \
            --clobber
