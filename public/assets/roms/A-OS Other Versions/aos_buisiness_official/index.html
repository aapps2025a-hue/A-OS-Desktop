<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>A-OS Bitlocker</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      background: #000;
      color: #fff;
      font-family: Arial, sans-serif;
    }

    #loader {
      position: fixed;
      inset: 0;
      z-index: 10;
      display: flex;
      align-items: center;
      justify-content: center;
      background: radial-gradient(circle at center, #1b1b1b 0%, #090909 45%, #000 100%);
      transition: opacity 0.8s ease, visibility 0.8s ease;
    }

    #loader.hidden {
      opacity: 0;
      visibility: hidden;
    }

    .loader-box {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 20px;
    }

    .loader-box h1 {
      margin: 0;
      color: #fff;
      letter-spacing: 6px;
      font-size: 32px;
    }

    .spinner {
      position: relative;
      width: 76px;
      height: 76px;
      border: 5px solid rgba(255, 255, 255, 0.12);
      border-top-color: #7c3aed;
      border-right-color: #22d3ee;
      border-radius: 50%;
      animation: spin 0.9s linear infinite;
      box-shadow:
        0 0 18px rgba(124, 58, 237, 0.7),
        0 0 35px rgba(34, 211, 238, 0.35);
    }

    .spinner::after {
      content: "";
      position: absolute;
      inset: 10px;
      border: 3px solid transparent;
      border-bottom-color: #ec4899;
      border-left-color: #f97316;
      border-radius: 50%;
      animation: spinReverse 1.2s linear infinite;
    }

    .loading-text {
      color: #e5e7eb;
      font-size: 14px;
      letter-spacing: 3px;
      text-transform: uppercase;
      animation: pulse 1.5s ease-in-out infinite;
    }

    .locker {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
    }

    .panel {
      width: min(100%, 380px);
      padding: 32px;
      text-align: center;
      border: 1px solid #333;
      border-radius: 14px;
      background: #111;
      box-shadow: 0 0 30px rgba(255, 255, 255, 0.08);
    }

    .hidden {
      display: none;
    }

    h1 {
      margin-top: 0;
      font-size: 28px;
    }

    p {
      color: #aaa;
      line-height: 1.5;
    }

    form {
      display: grid;
      gap: 12px;
      margin-top: 24px;
    }

    input {
      width: 100%;
      padding: 13px;
      border: 1px solid #444;
      border-radius: 6px;
      outline: none;
      background: #050505;
      color: #fff;
      font-size: 15px;
    }

    input:focus {
      border-color: #fff;
    }

    button {
      width: 100%;
      margin-top: 14px;
      padding: 13px;
      border: 0;
      border-radius: 6px;
      background: #fff;
      color: #000;
      cursor: pointer;
      font-size: 15px;
      font-weight: bold;
    }

    button:hover {
      background: #ccc;
    }

    button.secondary {
      background: transparent;
      color: #fff;
      border: 1px solid #555;
    }

    button.secondary:hover {
      background: #222;
    }

    .message {
      min-height: 20px;
      margin-bottom: 0;
      color: #ff6b6b;
      font-size: 14px;
    }

    .lock-container {
      position: relative;
      width: 60px;
      height: 80px;
      margin: 0 auto 20px;
    }

    .lock-shackle {
      position: absolute;
      top: 0;
      left: 10px;
      width: 40px;
      height: 40px;
      border: 6px solid #333;
      border-bottom: none;
      border-radius: 40px 40px 0 0;
    }

    .lock-body {
      position: absolute;
      bottom: 0;
      width: 60px;
      height: 46px;
      background: #f39c12;
      border: 4px solid #333;
      border-radius: 6px;
    }

    .lock-keyhole {
      position: absolute;
      top: 50%;
      left: 50%;
      width: 8px;
      height: 8px;
      background: #333;
      border-radius: 50%;
      transform: translate(-50%, -50%);
    }

    .lock-keyhole::after {
      content: "";
      position: absolute;
      top: 6px;
      left: 2px;
      width: 4px;
      height: 10px;
      background: #333;
    }

    .success-icon {
      margin-bottom: 14px;
      color: #22c55e;
      font-size: 48px;
    }

    @keyframes spin {
      to {
        transform: rotate(360deg);
      }
    }

    @keyframes spinReverse {
      to {
        transform: rotate(-360deg);
      }
    }

    @keyframes pulse {
      50% {
        opacity: 0.45;
      
    }
  </style>
</head>
<body>
  <div id="loader">
    <div class="loader-box">
      <h1>A-OS</h1>
      <div class="spinner"></div>
      <div class="loading-text">Booting to Bitlocker</div>
    </div>
  </div>

  <main class="locker">
    <section id="setupScreen" class="panel hidden">
      <h1>Set BitLocker Password</h1>
      <p>In A-OS Business edition, you need to set a password before booting to OS</p> 

      <form id="setupForm">
        <input id="setupPassword" type="password" placeholder="Create password" required>
        <input id="confirmPassword" type="password" placeholder="Confirm password" required>
        <button type="submit">Set Password</button>
      </form>

      <p id="setupMessage" class="message"></p>
    </section>

    <section id="lockScreen" class="paned hidden">
      <div class="lock-container">
        <div class="lock-shackle"></div>
        <div class="lock-body">
          <div class="lock-keyhole"></div>
        </div>
      </div>

      <h1>BitLocked</h1>
      <p>Enter your password to boot A-OS.</p>

      <form id="unlockForm">
        <input id="unlockPassword" type="password" placeholder="Password" required>
        <button type="submit">Unlock</button>
      </form>

      <button id="changePasswordButton" class="secondary">Change Password</button>
      <p id="unlockMessage" class="message"></p>
    </section>

    <section id="unlockedScreen" class="panel hidden">
      <div class="success-icon">✓</div>
      <h1>Unlocked</h1>
      <p>Your password was accepted.</p>

      <button id="lockButton">Lock Screen</button>
      <button id="changePasswordUnlockedButton" class="secondary">
        Change Password
      </button>

      <p id="changeMessage" class="message"></p>
    </section>

    <section id="changeScreen" class="panel hidden">
      <h1>Change Password</h1>
      <p>Enter your current password first.</p>

      <form id="changeForm">
        <input id="currentPassword" type="password" placeholder="Current password" required>
        <input id="newPassword" type="password" placeholder="New password" required>
        <input id="confirmNewPassword" type="password" placeholder="Confirm new password" required>
        <button type="submit">Change Password</button>
      </form>

      <button id="cancelChangeButton" class="secondary">Cancel</button>
      <p id="changeFormMessage" class="message"></p>
    </section>
  </main>

  <script>
    const passwordKey = "lockerPassword";

    const setupScreen = document.getElementById("setupScreen");
    const lockScreen = document.getElementById("lockScreen");
    const unlockedScreen = document.getElementById("unlockedScreen");
    const changeScreen = document.getElementById("changeScreen");

    const setupForm = document.getElementById("setupForm");
    const unlockForm = document.getElementById("unlockForm");
    const changeForm = document.getElementById("changeForm");

    const setupMessage = document.getElementById("setupMessage");
    const unlockMessage = document.getElementById("unlockMessage");
    const changeFormMessage = document.getElementById("changeFormMessage");

    function showScreen(screen) {
      [setupScreen, lockScreen, unlockedScreen, changeScreen]
        .forEach((item) => item.classList.add("hidden"));

      screen.classList.remove("hidden");
    }

    function getPassword() {
      return localStorage.getItem(passwordKey);
    }

    function showInitialScreen() {
      showScreen(getPassword() ? lockScreen : setupScreen);
    }

    setupForm.addEventListener("submit", (event) => {
      event.preventDefault();

      const password = document.getElementById("setupPassword").value;
      const confirmation = document.getElementById("confirmPassword").value;

      if (password.length < 4) {
        setupMessage.textContent = "Password must be at least 4 characters.";
        return;
      }

      if (password !== confirmation) {
        setupMessage.textContent = "Passwords do not match.";
        return;
      }

      localStorage.setItem(passwordKey, password);
      setupForm.reset();
      setupMessage.textContent = "";
      showScreen(lockScreen);
    });

    unlockForm.addEventListener("submit", (event) => {
      event.preventDefault();

      const password = document.getElementById("unlockPassword").value;

      if (password === getPassword()) {
        unlockForm.reset();
        unlockMessage.textContent = "";
        showScreen(unlockedScreen);
      } else {
        unlockMessage.textContent = "Incorrect password.";
      }
    });

    function openChangeScreen() {
      changeForm.reset();
      changeFormMessage.textContent = "";
      showScreen(changeScreen);
    }

    document.getElementById("changePasswordButton")
      .addEventListener("click", openChangeScreen);

    document.getElementById("changePasswordUnlockedButton")
      .addEventListener("click", openChangeScreen);

    document.getElementById("cancelChangeButton")
      .addEventListener("click", () => showScreen(lockScreen));

    document.getElementById("lockButton")
      .addEventListener("click", () => showScreen(lockScreen));

    changeForm.addEventListener("submit", (event) => {
      event.preventDefault();

      const currentPassword = document.getElementById("currentPassword").value;
      const newPassword = document.getElementById("newPassword").value;
      const confirmation = document.getElementById("confirmNewPassword").value;

      if (currentPassword !== getPassword()) {
        changeFormMessage.textContent = "Current password is incorrect.";
        return;
      }

      if (newPassword.length < 4) {
        changeFormMessage.textContent = "New password must be at least 4 characters.";
        return;
      }

      if (newPassword !== confirmation) {
        changeFormMessage.textContent = "New passwords do not match.";
        return;
      }

      localStorage.setItem(passwordKey, newPassword);
      changeForm.reset();
      changeFormMessage.textContent = "";
      showScreen(lockScreen);
    });

    window.addEventListener("load", () => {
      showInitialScreen();

      setTimeout(() => {
        document.getElementById("loader").classList.add("hidden");
      }, 1500);
    });
  </script>
</body>
</html>
