    <script>
      (() => {
        "use strict";

        const OPTIONS = {
          base: "https://cdn.jsdelivr.net/gh/twitter/twemoji@14.0.2/assets/",
          folder: "svg",
          ext: ".svg"
        };

        const observers = new WeakMap();

        function parse(root) {
          if (!window.twemoji || !root) return;
          if (root.nodeType === Node.ELEMENT_NODE && root.matches("img.emoji, textarea, input, script, style, code, pre")) return;
          twemoji.parse(root, OPTIONS);
        }

        function plainText(editor) {
          const copy = editor.cloneNode(true);
          copy.querySelectorAll("img.emoji").forEach((image) => {
            image.replaceWith(document.createTextNode(image.alt || ""));
          });
          return copy.innerText.replace(/\r/g, "");
        }

        function caretToEnd(editor) {
          const selection = editor.ownerDocument.getSelection();
          const range = editor.ownerDocument.createRange();
          range.selectNodeContents(editor);
          range.collapse(false);
          selection.removeAllRanges();
          selection.addRange(range);
        }

        function renderEditor(editor, focusAfter = false) {
          const textarea = editor._aosTextarea;
          const text = plainText(editor);
          textarea.value = text;
          editor.textContent = text;
          parse(editor);
          if (focusAfter) caretToEnd(editor);
        }

        function upgradeTextarea(textarea) {
          if (textarea.dataset.aosEmojiReady === "true") return;
          textarea.dataset.aosEmojiReady = "true";
          textarea.classList.add("aos-emoji-source");

          const editor = textarea.ownerDocument.createElement("div");
          editor.className = "aos-emoji-editor";
          editor.contentEditable = textarea.disabled || textarea.readOnly ? "false" : "true";
          editor.setAttribute("role", "textbox");
          editor.setAttribute("aria-multiline", "true");
          editor.setAttribute("aria-label", textarea.getAttribute("aria-label") || textarea.name || "Text area");
          editor.dataset.placeholder = textarea.placeholder || "";
          editor._aosTextarea = textarea;
          textarea.insertAdjacentElement("afterend", editor);
          editor.textContent = textarea.value;
          parse(editor);

          editor.addEventListener("input", () => renderEditor(editor, true));
          editor.addEventListener("paste", (event) => {
            event.preventDefault();
            const text = event.clipboardData.getData("text/plain");
            editor.ownerDocument.execCommand("insertText", false, text);
          });

          textarea.form?.addEventListener("reset", () => {
            setTimeout(() => {
              editor.textContent = textarea.value;
              parse(editor);
            });
          });
        }

        function prepare(root) {
          if (!root?.querySelectorAll) return;
          root.querySelectorAll("textarea").forEach(upgradeTextarea);
          root.querySelectorAll("iframe").forEach(prepareIframe);
        }

        function observe(doc) {
          if (!doc.body || observers.has(doc)) return;
          const observer = new MutationObserver((mutations) => {
            for (const mutation of mutations) {
              for (const node of mutation.addedNodes) {
                if (node.nodeType !== Node.ELEMENT_NODE || node.matches("img.emoji")) continue;
                if (node.matches("textarea")) upgradeTextarea(node);
                if (node.matches("iframe")) prepareIframe(node);
                prepare(node);
                parse(node);
              }
            }
          });
          observer.observe(doc.body, { childList: true, subtree: true });
          observers.set(doc, observer);
        }

        function prepareIframe(iframe) {
          if (iframe.dataset.aosEmojiFrameReady === "true") return;
          iframe.dataset.aosEmojiFrameReady = "true";
          iframe.addEventListener("load", () => {
            try {
              const doc = iframe.contentDocument;
              if (!doc?.body) return;
              parse(doc.body);
              prepare(doc);
              observe(doc);
            } catch (_) {
              /* Browsers prohibit changes inside cross-origin embeds. */
            }
          });
        }

        document.addEventListener("DOMContentLoaded", () => {
          parse(document.body);
          prepare(document);
          observe(document);
        });
      })();
